# Memória ajustada para máquinas com pouca RAM (a original pedia 8 GB e o
# Gradle caía com "daemon disappeared" num PC de 4 GB). 1,5 GB é suficiente
# para compilar este app.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compila o Kotlin dentro do próprio processo do Gradle, sem abrir um segundo
# processo Java disputando memória.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true

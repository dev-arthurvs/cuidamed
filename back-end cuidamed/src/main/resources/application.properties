spring.application.name=cuidamed-backend

# Porta: o Railway define PORT; no PC fica 8080.
server.port=${PORT:8080}

# Banco: as variáveis PG* são as que o PostgreSQL do Railway fornece. No PC,
# os valores padrão apontam para o banco local e a senha fica no .env.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cuidamed_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# A estrutura do banco é criada/atualizada pelo Flyway (db/migration); o
# Hibernate só confere se as entidades batem com ela.
spring.jpa.hibernate.ddl-auto=validate
# Banco que já existia antes do Flyway (o local): é marcado como estando na V1
# (as tabelas do schema original) e recebe só as migrações seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Imprimir cada consulta SQL: útil para depurar, pesado em produção (MOSTRAR_SQL=true para ligar).
spring.jpa.show-sql=${MOSTRAR_SQL:false}

server.error.include-message=always

# Saúde do servidor para o Railway: só /actuator/health, sem detalhes internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-haiku-4-5-20251001

# Login (token JWT). JWT_SECRET: texto aleatório com pelo menos 32 caracteres,
# definido no .env (local) ou nas variáveis do servidor. Sem ele, um segredo
# temporário é gerado a cada inicialização e todos precisam entrar de novo.
cuidamed.jwt.segredo=${JWT_SECRET:}
cuidamed.jwt.validade-dias=7

# Endereços (origens) que podem chamar a API pelo navegador, separados por vírgula.
cuidamed.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5050,http://127.0.0.1:5050}